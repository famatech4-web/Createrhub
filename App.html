<script>
const TOKEN_KEY='creatorhub_session_v1', DRAFT_KEY='creatorhub_drafts_v1', PREF_KEY='creatorhub_preferences_v1';
let token=localStorage.getItem(TOKEN_KEY)||'', currentUser=null, currentPage='dashboard', cache={tasks:[],messages:[],content:[],presence:[]}, heartbeatTimer=null, pollTimer=null;
const $=id=>document.getElementById(id);
function api(action,payload={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>{if(!r||!r.ok){reject(new Error(r&&r.error||'Request failed'));return;}resolve(r.data!==undefined?r.data:r);}).withFailureHandler(e=>reject(new Error(e.message||'Server error'))).apiCall(action,payload,token));}
function toast(msg,error=false){const el=$('toast');el.textContent=msg;el.className='toast show'+(error?' error':'');setTimeout(()=>el.className='toast',3000);}
function showAuth(which){['login','signup','reset'].forEach(x=>$(x+'Form').classList.toggle('hidden',x!==which));$('authTitle').textContent=which==='signup'?'Create your account':which==='reset'?'Reset password':'Welcome back';$('authSubtitle').textContent=which==='signup'?'Join your private creator workspace.':which==='reset'?'Use a one-time code from the workspace administrator.':'Sign in to continue creating together.';}
async function login(){try{const r=await api('login',{username:$('loginUsername').value,password:$('loginPassword').value}); token=r.token;currentUser=r.user;localStorage.setItem(TOKEN_KEY,token);await enterApp();}catch(e){toast(e.message,true);}}
async function signup(){try{const r=await api('signup',{username:$('signupUsername').value,password:$('signupPassword').value,inviteCode:$('inviteCode').value});token=r.token;currentUser=r.user;localStorage.setItem(TOKEN_KEY,token);await enterApp();}catch(e){toast(e.message,true);}}
async function resetPassword(){try{await api('resetPassword',{username:$('resetUsername').value,resetCode:$('resetCode').value,newPassword:$('resetNewPassword').value});toast('Password reset. Please sign in.');showAuth('login');}catch(e){toast(e.message,true);}}
async function enterApp(){try{currentUser=await api('me');$('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('sideName').textContent=currentUser.username;$('topName').textContent=currentUser.username;$('sideRole').textContent=currentUser.role;$('sideAvatar').textContent=currentUser.username[0].toUpperCase();$('topAvatar').textContent=currentUser.username[0].toUpperCase();const prefs=JSON.parse(localStorage.getItem(PREF_KEY)||'{}');if(prefs.theme==='light')document.body.classList.add('light');await navigate('dashboard');startPresence();}catch(e){localStorage.removeItem(TOKEN_KEY);token='';$('appView').classList.add('hidden');$('authView').classList.remove('hidden');}}
async function logout(){try{await api('logout');}catch(e){}stopPresence();localStorage.removeItem(TOKEN_KEY);token='';currentUser=null;$('appView').classList.add('hidden');$('authView').classList.remove('hidden');showAuth('login');}
function toggleSidebar(){$('sidebar').classList.toggle('open');}
function toggleTheme(){document.body.classList.toggle('light');const p=JSON.parse(localStorage.getItem(PREF_KEY)||'{}');p.theme=document.body.classList.contains('light')?'light':'dark';localStorage.setItem(PREF_KEY,JSON.stringify(p));}
async function navigate(page){currentPage=page;$('sidebar').classList.remove('open');document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const titles={dashboard:'Overview',tasks:'Tasks',messages:'Messages',content:'Content planner',settings:'Settings'};$('pageTitle').textContent=titles[page];$('pageContent').innerHTML='<div class="loading"><div class="spinner"></div>Loading workspace...</div>';try{if(page==='dashboard')await renderDashboard();if(page==='tasks')await renderTasks();if(page==='messages')await renderMessages();if(page==='content')await renderContent();if(page==='settings')renderSettings();}catch(e){$('pageContent').innerHTML='<div class="card empty"><strong>Could not load this page</strong>'+esc(e.message)+'</div>';toast(e.message,true);}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateText(v){if(!v)return 'No date';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function empty(title,sub){return `<div class="empty"><strong>${esc(title)}</strong>${esc(sub)}</div>`;}
async function refreshPresence(){try{cache.presence=await api('presence.list');}catch(e){}}
function presenceHTML(){return cache.presence.map(p=>`<div class="person-row"><div class="avatar">${esc(p.username[0].toUpperCase())}</div><div class="person-main"><b>${esc(p.username)}</b><small>${p.status==='online'?'Active now':'Last active '+(p.lastActive?dateText(p.lastActive):'unknown')}</small></div><span class="presence-dot ${p.status==='offline'?'offline':''}"></span><span class="presence-label">${p.status}</span></div>`).join('')||empty('No members','Invite your collaborator to join.');}
async function renderDashboard(){const d=await api('dashboard');cache.tasks=await api('tasks.list');await refreshPresence();const recent=cache.tasks.slice(0,4);$('pageContent').innerHTML=`<div class="welcome"><div><h3>Good to see you, ${esc(currentUser.username)} 👋</h3><p>Here's what's happening in your creator workspace.</p></div><button class="primary small-btn" onclick="openTaskModal()">＋ New task</button></div><div class="stats"><div class="stat-card"><span class="stat-label">Active tasks</span><strong>${d.tasks-d.completed}</strong><small>Across your workspace</small></div><div class="stat-card"><span class="stat-label">Completed</span><strong>${d.completed}</strong><small>Nice progress</small></div><div class="stat-card"><span class="stat-label">Unread messages</span><strong>${d.unread}</strong><small>Private conversations</small></div><div class="stat-card"><span class="stat-label">Content ideas</span><strong>${d.content}</strong><small>Planned posts & videos</small></div></div><div class="grid-2"><div class="card"><div class="card-head"><h3>Recent tasks</h3><button class="text-btn" onclick="navigate('tasks')">View all →</button></div>${recent.map(taskRow).join('')||empty('No tasks yet','Create your first shared task.')}</div><div class="card"><div class="card-head"><h3>Your collaborators</h3><span class="pill green">Live presence</span></div>${presenceHTML()}</div></div>`;}
function taskRow(t){return `<div class="task-row"><input class="check" type="checkbox" ${t.status==='Done'?'checked':''} onchange="quickTaskStatus('${t.taskId}',this.checked)"><div class="task-main"><b>${esc(t.title)}</b><small>${esc(t.status)} · Due ${dateText(t.dueDate)}</small></div><span class="pill ${t.priority==='High'?'orange':''}">${esc(t.priority)}</span></div>`;}
async function renderTasks(){cache.tasks=await api('tasks.list');$('pageContent').innerHTML=`<div class="toolbar"><h3>Shared tasks <span class="muted">(${cache.tasks.length})</span></h3><div class="toolbar-actions"><button class="primary small-btn" onclick="openTaskModal()">＋ Add task</button></div></div><div class="table-card">${cache.tasks.map(t=>taskRow(t)+`<div class="row-actions"><button class="tiny-btn" onclick="editTask('${t.taskId}')">Edit</button><button class="tiny-btn" onclick="removeTask('${t.taskId}')">Delete</button></div>`).join('')||empty('Your task list is clear','Add a task to plan your next video.')}</div>`;}
async function quickTaskStatus(id,done){try{await api('tasks.update',{taskId:id,status:done?'Done':'To do'});toast('Task updated');if(currentPage==='dashboard')renderDashboard();else renderTasks();}catch(e){toast(e.message,true);}}
function openModal(title,body,saveLabel,saveFn){const wrap=document.createElement('div');wrap.className='modal-backdrop';wrap.id='activeModal';wrap.innerHTML=`<div class="modal"><h3>${title}</h3>${body}<div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary small-btn" id="modalSave">${saveLabel}</button></div></div>`;document.body.appendChild(wrap);$('modalSave').onclick=async()=>{try{await saveFn();closeModal();}catch(e){toast(e.message,true);}};}
function closeModal(){const m=$('activeModal');if(m)m.remove();}
async function openTaskModal(t=null){const users=await api('dashboard');const members=users.users;const isEdit=!!t;const draftKey='task_'+(t?t.taskId:'new');openModal(isEdit?'Edit task':'Create a task',`<label>Task title</label><input id="mTitle" value="${esc(t?t.title:'')}" maxlength="120" placeholder="e.g. Write the next story script"><label>Description</label><textarea id="mDesc" placeholder="Add details...">${esc(t?t.description:'')}</textarea><label>Assign to</label><select id="mAssignee">${members.map(u=>`<option value="${u.userId}" ${(t&&t.assignedTo===u.userId)||(!t&&u.userId===currentUser.userId)?'selected':''}>${esc(u.username)}</option>`).join('')}</select><label>Priority</label><select id="mPriority">${['Low','Medium','High'].map(x=>`<option ${(t&&t.priority===x)?'selected':(!t&&x==='Medium')?'selected':''}>${x}</option>`).join('')}</select><label>Due date</label><input id="mDue" type="date" value="${esc(t?t.dueDate:'')}">`,isEdit?'Save changes':'Create task',async()=>{const p={title:$('mTitle').value,description:$('mDesc').value,assignedTo:$('mAssignee').value,priority:$('mPriority').value,dueDate:$('mDue').value};if(isEdit){p.taskId=t.taskId;await api('tasks.update',p);}else await api('tasks.create',p);removeDraft(draftKey);toast('Task saved');if(currentPage==='dashboard')await renderDashboard();else await renderTasks();});bindDraftFields(draftKey,['mTitle','mDesc','mAssignee','mPriority','mDue']);}
async function editTask(id){const t=cache.tasks.find(x=>x.taskId===id);if(t)openTaskModal(t);}
async function removeTask(id){if(!confirm('Delete this task? Only its creator can delete it.'))return;try{await api('tasks.delete',{taskId:id});toast('Task deleted');await renderTasks();}catch(e){toast(e.message,true);}}
async function renderMessages(){cache.messages=await api('messages.list');await api('messages.read');await refreshPresence();const other=cache.presence.find(p=>p.userId!==currentUser.userId);$('pageContent').innerHTML=`<div class="toolbar"><h3>Private messages</h3><span class="pill green">End-to-end transport: HTTPS</span></div><div class="chat-layout"><div class="card chat-card"><div class="chat-head"><div class="avatar">${other?esc(other.username[0].toUpperCase()):'?'}</div><div><b>${other?esc(other.username):'Waiting for collaborator'}</b><small>${other?other.status==='online'?'● Online':'○ Offline · Last active '+dateText(other.lastActive):'Invite your second user'}</small></div></div><div class="chat-messages" id="chatMessages">${cache.messages.map(m=>`<div class="bubble ${m.senderId===currentUser.userId?'mine':'theirs'}">${esc(m.body)}<time>${dateText(m.createdAt)}</time></div>`).join('')||empty('Start a conversation','Send your collaborator a message.')}</div><div class="chat-compose"><input id="messageInput" value="${esc(readDraft('message')||'')}" placeholder="Write a message..." oninput="saveDraft('message',this.value)" onkeydown="if(event.key==='Enter')sendMessage()"><button class="primary small-btn" onclick="sendMessage()">Send ↗</button></div></div><div class="card"><div class="card-head"><h3>Workspace members</h3></div>${presenceHTML()}</div></div>`;$('chatMessages').scrollTop=$('chatMessages').scrollHeight;}
async function sendMessage(){const input=$('messageInput'),body=input.value.trim();if(!body)return;try{await api('messages.send',{body});input.value='';removeDraft('message');await renderMessages();}catch(e){saveDraft('message',body);toast('Message saved as draft: '+e.message,true);}}
async function renderContent(){cache.content=await api('content.list');$('pageContent').innerHTML=`<div class="toolbar"><h3>Content pipeline</h3><button class="primary small-btn" onclick="openContentModal()">＋ New idea</button></div><div class="content-grid">${cache.content.map(c=>`<div class="content-card"><span class="pill">${esc(c.platform)}</span><h4>${esc(c.title)}</h4><p>${esc(c.idea||'No description added yet.')}</p><div class="content-meta"><span class="pill ${c.status==='Published'?'green':''}">${esc(c.status)}</span><span class="muted small">${dateText(c.publishDate)}</span></div><div class="row-actions" style="margin-top:13px"><button class="tiny-btn" onclick="editContent('${c.contentId}')">Edit</button><button class="tiny-btn" onclick="removeContent('${c.contentId}')">Delete</button></div></div>`).join('')||empty('No content plans yet','Capture a video idea before it gets away.')}</div>`;}
function openContentModal(c=null){const edit=!!c;const draftKey='content_'+(c?c.contentId:'new');openModal(edit?'Edit content plan':'New content idea',`<label>Title</label><input id="cTitle" value="${esc(c?c.title:'')}" placeholder="Video title or working idea"><label>Platform</label><select id="cPlatform">${['YouTube','TikTok','Both'].map(x=>`<option ${c&&c.platform===x?'selected':''}>${x}</option>`).join('')}</select><label>Idea / notes</label><textarea id="cIdea">${esc(c?c.idea:'')}</textarea><label>Script / outline</label><textarea id="cScript">${esc(c?c.script:'')}</textarea><label>Publish date</label><input id="cDate" type="date" value="${esc(c?c.publishDate:'')}"><label>Status</label><select id="cStatus">${['Idea','Scripting','Editing','Scheduled','Published'].map(x=>`<option ${c&&c.status===x?'selected':''}>${x}</option>`).join('')}</select>`,edit?'Save changes':'Save idea',async()=>{await api('content.save',{contentId:c?c.contentId:undefined,title:$('cTitle').value,platform:$('cPlatform').value,idea:$('cIdea').value,script:$('cScript').value,publishDate:$('cDate').value,status:$('cStatus').value});removeDraft(draftKey);toast('Content plan saved');await renderContent();});bindDraftFields(draftKey,['cTitle','cPlatform','cIdea','cScript','cDate','cStatus']);}
function editContent(id){const c=cache.content.find(x=>x.contentId===id);if(c)openContentModal(c);}
async function removeContent(id){if(!confirm('Delete this content plan?'))return;try{await api('content.delete',{contentId:id});await renderContent();toast('Content plan deleted');}catch(e){toast(e.message,true);}}
function renderSettings(){$('pageContent').innerHTML=`<div class="settings-grid"><div class="card setting-card"><h3>Appearance</h3><p>Choose the theme that feels right for your workspace.</p><button class="secondary" onclick="toggleTheme()">Switch dark / light mode</button></div><div class="card setting-card"><h3>Account security</h3><p>Update your account password. Use a unique password of at least 10 characters.</p><button class="primary small-btn" onclick="passwordModal()">Change password</button></div><div class="card setting-card"><h3>Draft recovery</h3><p>Unsent message drafts and local interface preferences are stored in this browser.</p><button class="secondary" onclick="clearLocalDrafts()">Clear saved drafts on this device</button></div><div class="card setting-card"><h3>Workspace</h3><p>Private two-person creator collaboration space.</p><div class="muted small">Signed in as ${esc(currentUser.username)} · ${esc(currentUser.role)}</div></div></div>`;}
function passwordModal(){openModal('Change password',`<label>Current password</label><input id="oldPass" type="password"><label>New password</label><input id="newPass" type="password">`,'Update password',async()=>{await api('changePassword',{currentPassword:$('oldPass').value,newPassword:$('newPass').value});toast('Password changed');});}
function clearLocalDrafts(){localStorage.removeItem(DRAFT_KEY);toast('Saved drafts cleared from this device.');}
function startPresence(){stopPresence();const beat=()=>api('presence.heartbeat').catch(()=>{});beat();heartbeatTimer=setInterval(beat,25000);pollTimer=setInterval(async()=>{try{await refreshPresence();if(currentPage==='dashboard')renderDashboard();if(currentPage==='messages')renderMessages();}catch(e){}},30000);}
function stopPresence(){if(heartbeatTimer)clearInterval(heartbeatTimer);if(pollTimer)clearInterval(pollTimer);heartbeatTimer=pollTimer=null;}
function saveDraft(key,value){const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');d[key]=value;localStorage.setItem(DRAFT_KEY,JSON.stringify(d));}
function readDraft(key){const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');return d[key];}
function removeDraft(key){const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');delete d[key];localStorage.setItem(DRAFT_KEY,JSON.stringify(d));}
function bindDraftFields(key,ids){const saved=readDraft(key)||{};ids.forEach(id=>{const el=$(id);if(!el)return;if(saved[id]!==undefined&&!el.value)el.value=saved[id];el.addEventListener('input',()=>{const data={};ids.forEach(k=>{if($(k))data[k]=$(k).value;});saveDraft(key,data);});});}
window.addEventListener('beforeunload',()=>{});
window.addEventListener('DOMContentLoaded',()=>{if(token)enterApp();else showAuth('login');});
</script>
